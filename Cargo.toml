[workspace]
resolver = "2"
members = [
  "crates/nisaba-compile-core",
  "crates/nisaba-compile-wasm",
  "crates/nisaba-server",
  "crates/nisaba-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.94"
authors = ["Nisaba contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Loro still depends on the archived `im` crate (RUSTSEC-2026-0248). This shim
# re-exports `imbl`, its maintained fork, which also removes `sized-chunks` and
# `bitmaps`. Remove it when Loro moves to `imbl`.
[patch.crates-io]
im = { path = "vendor/im" }
