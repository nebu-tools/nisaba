[package]
name = "nisaba-server"
description = "Nisaba as one process: web client, accounts, sync and export."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nisaba"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
loro = "1.18"
nisaba-compile-core = { path = "../nisaba-compile-core" }
nisaba-sync = { path = "../nisaba-sync" }
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
rustix = { version = "1", features = ["process", "fs", "thread"] }
seccompiler = "0.5"
libc = "0.2"

[[test]]
name = "sandbox"
harness = false

[dev-dependencies]
tokio-tungstenite = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tempfile = "3"

[lints]
workspace = true
