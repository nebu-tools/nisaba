[package]
name = "nisaba-server"
description = "Nisaba as one process: web client, accounts, sync and export."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nisaba"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
loro = "1.18"
nisaba-compile-core = { path = "../nisaba-compile-core" }
nisaba-sync = { path = "../nisaba-sync" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rust-embed = "8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "process", "io-util", "fs"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
rustix = { version = "1", features = ["process", "fs", "thread"] }
seccompiler = "0.5"
libc = "0.2"
close_fds = "0.3.2"

[[test]]
name = "sandbox"
harness = false

[dev-dependencies]
futures-channel = "0.3"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tempfile = "3"

[lints]
workspace = true
