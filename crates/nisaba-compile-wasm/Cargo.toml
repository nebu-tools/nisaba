[package]
name = "nisaba-compile-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wasm-bindgen binding of nisaba-compile-core for the preview worker."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nisaba-compile-core = { path = "../nisaba-compile-core" }
serde_json = "1"
# The wasm-bindgen CLI in scripts/build-wasm.mjs must match this version.
wasm-bindgen = "0.2.130"
