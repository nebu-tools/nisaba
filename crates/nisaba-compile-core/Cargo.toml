[package]
name = "nisaba-compile-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Incremental Typst compiler for one project, shared by the browser preview and the server export."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"

[dev-dependencies]
serde_json = "1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
